<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" /> <!-- Bright Green -->
      <stop offset="100%" stop-color="#14532d" /> <!-- Dark Forest Green -->
    </linearGradient>
  </defs>
  <!-- Rounded Square Background -->
  <rect width="100" height="100" rx="24" fill="url(#greenGrad)" />
  <!-- 'GET' Text (Green Engineering Tools) -->
  <text x="50" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="42" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="-1">GET</text>
</svg>
